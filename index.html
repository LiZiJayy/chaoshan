<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>潮汕投掷圣杯</title>
  <style>
    :root {
      --bg1: #190b08;
      --bg2: #431b12;
      --gold: #f6d17a;
      --gold2: #b8782e;
      --red: #b91c1c;
      --text: #fff7df;
      --muted: #e8cfa4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(246, 209, 122, 0.24), transparent 30%),
        linear-gradient(160deg, var(--bg1), var(--bg2) 55%, #120604);
      overflow-x: hidden;
    }

    .page {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 28px 16px 44px;
    }

    .hero {
      text-align: center;
      margin-bottom: 20px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border: 1px solid rgba(246, 209, 122, 0.45);
      border-radius: 999px;
      color: var(--gold);
      background: rgba(255, 255, 255, 0.06);
      font-size: 13px;
    }

    h1 {
      margin: 16px 0 8px;
      font-size: clamp(32px, 8vw, 72px);
      letter-spacing: 0.08em;
      text-shadow: 0 6px 22px rgba(0, 0, 0, 0.45);
    }

    .subtitle {
      margin: 0 auto;
      max-width: 720px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 16px;
    }

    .app {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 18px;
      align-items: stretch;
    }

    .panel {
      border: 1px solid rgba(246, 209, 122, 0.28);
      border-radius: 28px;
      background: rgba(30, 10, 8, 0.62);
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      overflow: hidden;
    }

    .camera-wrap {
      position: relative;
      min-height: 420px;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    video, canvas {
      position: absolute;
      width: calc(100% - 32px);
      height: calc(100% - 32px);
      object-fit: cover;
      border-radius: 22px;
      transform: scaleX(-1);
      background: #120604;
    }

    canvas { pointer-events: none; }

    .camera-placeholder {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 360px;
      padding: 24px;
    }

    .camera-placeholder .icon { font-size: 58px; }

    .status {
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: 28px;
      z-index: 3;
      padding: 12px 14px;
      border-radius: 16px;
      color: #fff7df;
      background: rgba(0, 0, 0, 0.46);
      font-size: 14px;
      line-height: 1.5;
    }

    .side {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .altar {
      position: relative;
      min-height: 240px;
      border-radius: 24px;
      background:
        radial-gradient(circle at center, rgba(246, 209, 122, 0.23), transparent 42%),
        linear-gradient(180deg, rgba(255,255,255,0.08), rgba(0,0,0,0.12));
      border: 1px solid rgba(246, 209, 122, 0.22);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .altar::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px dashed rgba(246, 209, 122, 0.28);
      border-radius: 20px;
    }

    .moon-blocks {
      position: relative;
      display: flex;
      gap: 20px;
      z-index: 2;
    }

    .cup {
      width: 72px;
      height: 112px;
      border-radius: 72px 72px 18px 18px;
      background: linear-gradient(135deg, #f8df98, #a95e24 70%);
      box-shadow: inset -12px -16px 20px rgba(80, 30, 10, 0.28), 0 14px 30px rgba(0,0,0,0.35);
      transform-origin: center 80%;
      position: relative;
    }

    .cup::after {
      content: "";
      position: absolute;
      inset: 12px 16px 36px;
      border-radius: 50%;
      background: rgba(255, 246, 204, 0.38);
    }

    .cup.face-down {
      background: linear-gradient(135deg, #8d4a1f, #3a160c 80%);
    }

    .throwing .cup:first-child {
      animation: throwLeft 1.9s cubic-bezier(.16,.84,.35,1) both;
    }

    .throwing .cup:last-child {
      animation: throwRight 1.9s cubic-bezier(.16,.84,.35,1) both;
    }

    @keyframes throwLeft {
      0% { transform: translateY(0) rotate(0deg); }
      35% { transform: translate(-45px, -120px) rotate(-260deg); }
      72% { transform: translate(6px, 16px) rotate(-610deg); }
      100% { transform: translate(0, 0) rotate(-680deg); }
    }

    @keyframes throwRight {
      0% { transform: translateY(0) rotate(0deg); }
      35% { transform: translate(45px, -130px) rotate(280deg); }
      72% { transform: translate(-8px, 18px) rotate(630deg); }
      100% { transform: translate(0, 0) rotate(720deg); }
    }

    .result-card {
      border-radius: 22px;
      padding: 18px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(246, 209, 122, 0.22);
    }

    .result-title {
      margin: 0 0 8px;
      font-size: 28px;
      color: var(--gold);
    }

    .result-desc {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 14px 16px;
      cursor: pointer;
      font-weight: 700;
      color: #2a0d07;
      background: linear-gradient(135deg, #ffe7a0, #d08a32);
      box-shadow: 0 12px 24px rgba(0,0,0,0.22);
      transition: transform .18s ease, filter .18s ease;
    }

    button:hover { transform: translateY(-1px); filter: brightness(1.04); }
    button:disabled { opacity: .55; cursor: not-allowed; transform: none; }

    .secondary {
      color: var(--text);
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(246, 209, 122, 0.24);
    }

    .tips {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
      margin: 0;
      padding-left: 18px;
    }

    .pulse {
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 rgba(246, 209, 122, 0); }
      50% { box-shadow: 0 0 36px rgba(246, 209, 122, 0.36); }
    }

    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      .camera-wrap { min-height: 360px; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="badge">本地摄像头识别 · 不上传视频 · 纯前端</div>
      <h1>潮汕投掷圣杯</h1>
      <p class="subtitle">允许摄像头后，站在画面中，同时将双手从肩膀下方向上挥起。识别成功后，圣杯会自动抛出并给出随机结果。</p>
    </section>

    <section class="app">
      <div class="panel camera-wrap">
        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div id="placeholder" class="camera-placeholder">
          <div class="icon">杯</div>
          <h2>准备投掷圣杯</h2>
          <p>点击“开启摄像头”，授权后把上半身放入画面。</p>
        </div>
        <div id="status" class="status">等待开启摄像头。</div>
      </div>

      <aside class="panel side">
        <div id="altar" class="altar">
          <div id="moonBlocks" class="moon-blocks">
            <div id="cupA" class="cup"></div>
            <div id="cupB" class="cup"></div>
          </div>
        </div>

        <div class="result-card">
          <h2 id="resultTitle" class="result-title">尚未投掷</h2>
          <p id="resultDesc" class="result-desc">开启摄像头并完成双手上挥动作，或点击手动投掷体验。</p>
        </div>

        <div class="actions">
          <button id="startBtn">开启摄像头</button>
          <button id="manualBtn" class="secondary">手动投掷</button>
        </div>

        <ol class="tips">
          <li>建议在光线充足处使用，手机和电脑浏览器都可以。</li>
          <li>如果识别不灵敏，可以稍微后退，让肩膀和双手完整入镜。</li>
          <li>本页面不需要后端，适合直接部署到 GitHub Pages。</li>
        </ol>
      </aside>
    </section>
  </main>

  <script type="module">
    import { FilesetResolver, PoseLandmarker, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const placeholder = document.getElementById("placeholder");
    const statusEl = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");
    const manualBtn = document.getElementById("manualBtn");
    const altar = document.getElementById("altar");
    const resultTitle = document.getElementById("resultTitle");
    const resultDesc = document.getElementById("resultDesc");
    const cupA = document.getElementById("cupA");
    const cupB = document.getElementById("cupB");

    let poseLandmarker = null;
    let running = false;
    let lastVideoTime = -1;
    let motionHistory = [];
    let cooldownUntil = 0;
    let isThrowing = false;

    const results = [
      {
        name: "圣杯",
        desc: "一正一反，代表允准、顺利、可以继续前行。",
        faces: ["up", "down"]
      },
      {
        name: "笑杯",
        desc: "两面皆正，代表笑而不答、时机未定，可以静心后再问一次。",
        faces: ["up", "up"]
      },
      {
        name: "阴杯",
        desc: "两面皆反，代表暂不允准、需要重新考虑或换个方向。",
        faces: ["down", "down"]
      }
    ];

    function setStatus(text) {
      statusEl.textContent = text;
    }

    async function initPose() {
      if (poseLandmarker) return;
      setStatus("正在加载姿态识别模型，请稍候...");
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numPoses: 1
      });
    }

    async function startCamera() {
      try {
        startBtn.disabled = true;
        await initPose();
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: { ideal: 960 },
            height: { ideal: 720 }
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        placeholder.style.display = "none";
        running = true;
        startBtn.textContent = "摄像头已开启";
        setStatus("请把上半身放入画面，然后双手从肩膀下方向上挥起。");
        requestAnimationFrame(detectLoop);
      } catch (error) {
        console.error(error);
        startBtn.disabled = false;
        setStatus("摄像头开启失败：请检查浏览器权限，或确认页面使用 HTTPS / localhost 打开。");
      }
    }

    function detectLoop() {
      if (!running || !poseLandmarker) return;

      if (video.videoWidth && video.videoHeight) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }

      const now = performance.now();
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const result = poseLandmarker.detectForVideo(video, now);
        drawAndAnalyze(result, now);
      }
      requestAnimationFrame(detectLoop);
    }

    function drawAndAnalyze(result, now) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!result.landmarks || !result.landmarks.length) {
        setStatus("未检测到人体，请站到画面中央。");
        return;
      }

      const landmarks = result.landmarks[0];
      const drawingUtils = new DrawingUtils(ctx);
      drawingUtils.drawConnectors(landmarks, PoseLandmarker.POSE_CONNECTIONS, { color: "#f6d17a", lineWidth: 3 });
      drawingUtils.drawLandmarks(landmarks, { color: "#fff7df", radius: 3 });

      const leftShoulder = landmarks[11];
      const rightShoulder = landmarks[12];
      const leftWrist = landmarks[15];
      const rightWrist = landmarks[16];

      if (!leftShoulder || !rightShoulder || !leftWrist || !rightWrist) return;
      if ([leftShoulder, rightShoulder, leftWrist, rightWrist].some(p => p.visibility !== undefined && p.visibility < 0.45)) {
        setStatus("请让肩膀和双手完整入镜。");
        return;
      }

      const shoulderY = (leftShoulder.y + rightShoulder.y) / 2;
      const wristY = (leftWrist.y + rightWrist.y) / 2;
      const bothAboveShoulders = leftWrist.y < shoulderY - 0.05 && rightWrist.y < shoulderY - 0.05;

      motionHistory.push({ t: now, y: wristY, above: bothAboveShoulders });
      motionHistory = motionHistory.filter(item => now - item.t <= 900);

      const earliest = motionHistory[0];
      const movedUpFast = earliest && earliest.y - wristY > 0.18;
      const startedBelow = motionHistory.some(item => item.y > shoulderY + 0.08);

      if (!isThrowing && now > cooldownUntil && startedBelow && movedUpFast && bothAboveShoulders) {
        triggerThrow();
      } else if (!isThrowing) {
        setStatus(bothAboveShoulders ? "双手已举起，可以放下后再向上挥动。" : "准备中：请双手从肩膀下方向上挥起。");
      }
    }

    function randomResult() {
      const array = new Uint32Array(1);
      crypto.getRandomValues(array);
      return results[array[0] % results.length];
    }

    function applyCupFaces(result) {
      cupA.classList.toggle("face-down", result.faces[0] === "down");
      cupB.classList.toggle("face-down", result.faces[1] === "down");
    }

    function triggerThrow() {
      if (isThrowing) return;
      isThrowing = true;
      cooldownUntil = performance.now() + 3600;
      const result = randomResult();

      resultTitle.textContent = "投掷中...";
      resultDesc.textContent = "圣杯正在落定，请稍候。";
      setStatus("识别成功，正在投掷圣杯...");
      altar.classList.remove("pulse");
      altar.classList.add("throwing");

      cupA.classList.remove("face-down");
      cupB.classList.remove("face-down");

      window.setTimeout(() => {
        applyCupFaces(result);
      }, 1450);

      window.setTimeout(() => {
        altar.classList.remove("throwing");
        altar.classList.add("pulse");
        resultTitle.textContent = result.name;
        resultDesc.textContent = result.desc;
        setStatus("结果已出现。你可以再次挥手，或点击手动投掷。");
        motionHistory = [];
        isThrowing = false;
      }, 2000);
    }

    startBtn.addEventListener("click", startCamera);
    manualBtn.addEventListener("click", triggerThrow);
  </script>
</body>
</html>
